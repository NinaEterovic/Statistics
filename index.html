<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptography & Statistics — Homework Portfolio</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-color: #38bdf8;
            --text-color: #f3f4f6;
            --text-secondary: #9ca3af;
            --border-color: #1f2937;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 520px;
            width: 100%;
        }

        h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .menu-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background-color: #1e293b;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn:hover {
            background-color: var(--accent-color);
            color: #0b0f19;
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .badge {
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 3px 8px;
            border-radius: 6px;
        }
        
        .btn:hover .badge {
            background: rgba(11, 15, 25, 0.15);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Cryptography & Statistics</h1>
    <p>Interactive Homework Portfolio & Reports</p>
    
    <div class="menu-links">
        <a href="hmwk1.html" class="btn">
            <span>📂 Homework 1: Elliptic Curves & MACs</span>
            <span class="badge">HW1</span>
        </a>
        <a href="hmwk2.html" class="btn">
            <span>📂 Homework 2: Ethereum Wallet Pipeline</span>
            <span class="badge">HW2</span>
        </a>
        <a href="hmwk2real.html" class="btn">
            <span>📂 Homework 2 (Real): ECC & Cryptanalysis</span>
            <span class="badge">HW2 Real</span>
        </a>
        <a href="hmwk3.html" class="btn">
            <span>📂 Homework 3: Stochastic Penetration Models</span>
            <span class="badge">HW3</span>
        </a>
    </div>
</div>

</body>
</html>
